<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario OCR</title>

    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        video {
            width: 100%;
            max-width: 700px;
            border: 2px solid #333;
            border-radius: 8px;
        }

        button {
            padding: 10px;
            margin: 5px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
        }

        #resultado {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        #lista {
            background: white;
            padding: 10px;
            min-height: 100px;
            border-radius: 5px;
        }

        .ok {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Inventario OCR</h1>

    <h3>Total: <span id="total">0</span></h3>

    <video id="video" autoplay playsinline muted></video>

    <br>

    <button onclick="capturar()">Capturar una vez</button>
    <button onclick="iniciarAutoScan()">Iniciar automático</button>
    <button onclick="detenerAutoScan()">Detener automático</button>
    <button onclick="exportarTXT()">Exportar TXT</button>
    <button onclick="exportarCSV()">Exportar CSV</button>

    <input id="manual" type="text" placeholder="Añadir manualmente">

    <button onclick="agregarManual()">Añadir manualmente</button>

    <div id="resultado"></div>

    <h2>Registros</h2>

    <div id="lista">
        <ul id="registros"></ul>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const registros = new Set();

        let autoScan = false;
        let trabajando = false;

        const video = document.getElementById("video");
        const resultadoDiv = document.getElementById("resultado");

        // Mensaje en pantalla sin usar innerHTML con texto del OCR (evita inyección de HTML)
        function mostrarMensaje(texto, clase) {
            resultadoDiv.textContent = "";
            const span = document.createElement("span");
            if (clase) span.className = clase;
            span.textContent = texto;
            resultadoDiv.appendChild(span);
        }

        // La cámara solo funciona en https:// o localhost
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            mostrarMensaje(
                "La cámara no está disponible. Abre la página desde https:// o localhost.",
                "error"
            );
        } else {
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }
            })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                mostrarMensaje("Error cámara: " + err.message, "error");
            });
        }

        function actualizarContador() {
            document.getElementById("total").textContent = registros.size;
        }

        function agregarRegistro(valor) {
            valor = valor.trim().toUpperCase();

            if (!valor) return;

            if (registros.has(valor)) {
                mostrarMensaje("Duplicado: " + valor, "error");
                return;
            }

            registros.add(valor);

            const li = document.createElement("li");
            li.textContent = valor;
            document.getElementById("registros").appendChild(li);

            actualizarContador();
            mostrarMensaje("Añadido: " + valor, "ok");
        }

        async function capturar() {
            try {
                if (!video.videoWidth) {
                    mostrarMensaje("La cámara aún no está lista.", "error");
                    return;
                }

                const canvas = document.getElementById("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                mostrarMensaje("Procesando OCR...");

                const resultado = await Tesseract.recognize(canvas, "eng");
                const texto = resultado.data.text;

                // Solo cadenas de 6 a 40 caracteres que contengan al menos un dígito,
                // para ignorar palabras como "SAMSUNG" o "MONITOR"
                const coincidencias = texto.match(
                    /\b(?=[A-Z0-9\-]*\d)[A-Z0-9\-]{6,40}\b/gi
                );

                if (coincidencias) {
                    coincidencias.forEach(item => agregarRegistro(item));
                } else {
                    mostrarMensaje("No se detectó ningún número");
                }

            } catch (e) {
                mostrarMensaje("Error OCR: " + e.message, "error");
            }
        }

        async function iniciarAutoScan() {
            if (autoScan) return; // evita lanzar varios bucles a la vez

            autoScan = true;

            while (autoScan) {
                if (!trabajando) {
                    trabajando = true;
                    try {
                        await capturar();
                    } finally {
                        trabajando = false;
                    }
                }

                await new Promise(r => setTimeout(r, 2000));
            }
        }

        function detenerAutoScan() {
            autoScan = false;
        }

        function agregarManual() {
            const campo = document.getElementById("manual");
            agregarRegistro(campo.value);
            campo.value = "";
        }

        // Permitir añadir con Enter
        document.getElementById("manual").addEventListener("keydown", e => {
            if (e.key === "Enter") agregarManual();
        });

        function exportarTXT() {
            descargar([...registros].join("\n"), "inventario.txt", "text/plain");
        }

        function exportarCSV() {
            let csv = "NumeroSerie\n";

            registros.forEach(item => {
                csv += `"${item.replace(/"/g, '""')}"\n`;
            });

            // \uFEFF (BOM) para que Excel lea bien los acentos
            descargar("\uFEFF" + csv, "inventario.csv", "text/csv;charset=utf-8");
        }

        function descargar(contenido, nombre, tipo) {
            const blob = new Blob([contenido], { type: tipo });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = nombre;

            document.body.appendChild(a); // necesario en algunos navegadores
            a.click();
            document.body.removeChild(a);

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>

</body>
</html>
